<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    </head>
<body class="bg-white">

    <div class="min-h-screen flex items-center justify-center bg-white p-4">
        
        <div class="flex flex-col lg:flex-row max-w-7xl w-full mx-auto">
            
            <div class="hidden lg:flex lg:w-1/2 items-center justify-center"> 
                <img src="./assets/icons/dl.beatsnoop 1.svg" alt="phone and shopping carts" class="object-cover scale-[1.5] w-full h-auto max-w-md">
            </div>

            <div class="w-full lg:w-1/2 p-8 flex flex-col justify-center">
                
                <h2 class="text-3xl font-semibold mb-2 text-gray-800">Log in to Exclusive</h2>
                <p class="text-sm text-gray-800 mb-10">Enter your details below</p>

                <form class="space-y-8">
                    
                    <div>
                        <input type="email" placeholder="Email" required 
                               class="w-full pb-2 text-sm placeholder-gray-500
                                      border-b border-gray-400 
                                      border-t-0 border-l-0 border-r-0 
                                      focus:border-red-500 focus:ring-0 focus:outline-none"> 
                                      </div>

                    <div>
                         <input type="password" placeholder="Password" required
                               class="w-full pb-2 text-sm placeholder-gray-500
                                      border-b border-gray-400 
                                      border-t-0 border-l-0 border-r-0 
                                      focus:border-red-500 focus:ring-0 focus:outline-none">
                    </div>

                    <div class="flex items-center justify-center pt-2">
                        
                        <button type="submit" 
                                class="px-8 md:px-40 lg:px-60  py-3 text-white bg-red-500 hover:bg-red-600 rounded-sm transition duration-150 text-sm font-medium tracking-wide">
                            Login
                        </button>

                    </div>
                    
                    <div class="pt-4 text-left text-sm text-gray-600">
                        Don't have an account? 
                        <a href="http://127.0.0.1:5500/index.html" class="text-red-500 font-medium hover:text-red-700 underline-offset-2 hover:underline">
                            Register
                        </a>
                    </div>

                </form>

            </div>
            
        </div>
    </div>

</body>
</html>
